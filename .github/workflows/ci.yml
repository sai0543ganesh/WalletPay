name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: walletpay_test
          POSTGRES_USER: walletpay_test
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walletpay_test -d walletpay_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit tests and package
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Real PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/walletpay_test
          TEST_DATABASE_USERNAME: walletpay_test
          TEST_DATABASE_PASSWORD: ci-disposable-password
        run: mvn -B -ntp -Pintegration verify
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test -- --run
      - run: npm run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -f infra/docker/backend.Dockerfile -t walletpay-api:ci .
      - name: Build frontend image
        run: docker build --pull -f infra/docker/frontend.Dockerfile -t walletpay-web:ci .
      - name: Build HTTPS edge image
        run: docker build --pull -f infra/docker/edge.Dockerfile -t walletpay-edge:ci .
      - name: Check Compose model
        run: |
          node infra/scripts/setup-env.mjs
          docker compose --env-file .env -f infra/compose.yaml config --quiet
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.ec2.yaml config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the production-build sandbox stack
        env:
          SANDBOX_WEBHOOK_ENABLED: "true"
          DEMO_FUNDING_ENABLED: "true"
        run: docker compose --env-file .env -f infra/compose.yaml up --build --wait --wait-timeout 180 -d
      - name: Install browser verification tooling
        run: |
          npm --prefix tests/e2e ci
          cd tests/e2e
          npx playwright install --with-deps chromium
      - name: Verify real browser journeys against Nginx, API and PostgreSQL
        run: |
          APP_URL=http://localhost:8088 npm --prefix tests/e2e test
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 7
      - name: Stop the disposable CI stack
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
