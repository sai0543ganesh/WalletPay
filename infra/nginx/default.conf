# Avoid recording query strings, cookies, bodies or authorization headers.
log_format walletpay '$request_id $request_method $uri $status $request_time';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout walletpay;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-store always;
    }

    # Keep the full Actuator surface private; API health is checked internally.
    location /actuator/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
