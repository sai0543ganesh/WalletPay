name: ${COMPOSE_PROJECT_NAME:-walletpay}

services:
  database:
    image: postgres:18-alpine
    user: postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-walletpay}
      POSTGRES_USER: ${DATABASE_USERNAME:-walletpay}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 90s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-walletpay}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-walletpay}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      SANDBOX_WEBHOOK_ENABLED: ${SANDBOX_WEBHOOK_ENABLED:-false}
      DEMO_FUNDING_ENABLED: ${DEMO_FUNDING_ENABLED:-false}
    secrets: [database_password, jwt_secret, webhook_secret]
    networks: [application, database]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports: ["127.0.0.1:${APP_PORT:-8088}:8080"]
    networks: [application]
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  application:
  database:
    internal: true

volumes:
  postgres_data:

secrets:
  database_password:
    file: ../.secrets/database_password
  jwt_secret:
    file: ../.secrets/jwt_secret
  webhook_secret:
    file: ../.secrets/webhook_secret
